apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/asergienk/lvm-operator?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/pull_request_number: '{{pull_request_number}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "true"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: event == "pull_request" && target_branch
      == "main" && ( "release/catalog/***".pathChanged() || ".tekton/lvm-operator-c23e6-pull-request.yaml".pathChanged()
      )
  labels:
    appstudio.openshift.io/application: lvm-operator
    appstudio.openshift.io/component: lvm-operator-c23e6
    pipelines.appstudio.openshift.io/type: build
  name: lvm-operator-c23e6-on-pull-request
  namespace: asergien-tenant
spec:
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: output-image
    value: quay.io/redhat-user-workloads-stage/asergien-tenant/lvm-operator-c23e6:on-pr-{{
  - name: image-expires-after
    value: 5d
  - name: dockerfile
    value: release/catalog/catalog.konflux.Dockerfile
  - name: build-args
    value:
    - CATALOG_VERSION=v5.1
    - BASE_IMAGE=registry.redhat.io/openshift5/ose-operator-registry-rhel9
  - name: hermetic
    value: "true"
  - name: skip-additional-tags
    value: "true"
  - name: build-platforms
    value:
    - linux/x86_64
    - linux/arm64
    - linux/ppc64le
    - linux/s390x
  - name: opm_args
    value:
    - alpha
    - render-template
    - semver
    - "--migrate-level=bundle-object-to-csv-metadata"
    - release/catalog/lvm-operator-catalog-template.yaml
  - name: catalog-output-path
    value: "release/catalog/lvm-operator-catalog.json"
  - name: catalog-template-merge-script
    value: "./release/hack/prepare-catalog.sh"
  - name: catalog-patch-script
    value: "./release/hack/render-catalog.sh"
  - name: catalog-patch-image
    value: quay.io/konflux-ci/yq@sha256:41aee71bcaa8a759073e00d6acea358fbc4013ad6e28554729451606c0c35591
  pipelineSpec:
    description: |
      This pipeline is ideal for building and verifying [file-based catalogs](https://konfilding-olm/#building-the-file-based-catalog).

      _Uses `buildah` to create a container image. Its build-time tests are limited to vernd do not scan the image.
      This pipeline is pushed as a Tekton bundle to [quay.io](https://quay.io/repository/konflux-ci/tekton-catalog/pipeline-fbc-builder?tab=tags)_
    params:
    - description: Source Repository URL
      name: git-url
      type: string
    - default: ""
      description: Revision of the Source Repository
      name: revision
      type: string
    - description: Fully Qualified Output Image
      name: output-image
      type: string
    - default: .
      description: Path to the source code of an application's component from where
        to build image.
      name: path-context
      type: string
    - default: Dockerfile
      description: Path to the Dockerfile inside the context specified by parameter
        path-context
      name: dockerfile
      type: string
    - default: "false"
      description: Skip checks against built image
      name: skip-checks
      type: string
    - default: "true"
      description: Execute the build with network isolation
      name: hermetic
      type: string
    - default: ""
      description: Build dependencies to be prefetched
      name: prefetch-input
      type: string
    - default: ""
      description: Image tag expiration time, time values could be something like
        1h, 2d, 3w for hours, days, and weeks, respectively.
      name: image-expires-after
      type: string
    - default: "false"
      description: Build a source image.
      name: build-source-image
      type: string
    - default: "true"
      description: Add built image into an OCI image index
      name: build-image-index
      type: string
    - default: "false"
      description: Enable cache proxy configuration
      name: enable-cache-proxy
      type: string
    - default: "true"
      description: Use the package registry proxy when prefetching dependencies
      name: enable-package-registry-proxy
      type: string
    - default: .
      description: Target directories in component's source code to scan with SAST
        tools. Multiple values should be separated with commas.
      name: sast-target-dirs
      type: string
    - default: []
      description: Array of --build-arg values ("arg=value" strings) for buildah
      name: build-args
      type: array
    - default: ""
      description: Path to a file with build arguments for buildah, see https://www.mankie-arg-file
      name: build-args-file
      type: string
    - default: ""
      description: Sets the image created time and the SOURCE_DATE_EPOCH build argument.
        On its own, it does not change file timestamps inside the layers (set rewrite-timestamp
        to "true" for that). Leave empty to keep the actual build time.
      name: source-date-epoch
      type: string
    - default: "false"
      description: When "true", clamp file modification times in the image layers
        to at most source-date-epoch. Does nothing unless source-date-epoch is set.
      name: rewrite-timestamp
      type: string
    - default: "false"
      description: When "true", omit the build history (history timestamps, layer
        metadata, etc.) from the resulting image.
      name: omit-history
      type: string
    - default:
      - linux/x86_64
      description: List of platforms to build the container images on. The available
        set of values is determined by the configuration of the multi-platform-controller.
      name: build-platforms
      type: array
    - name: opm_args
      type: array
      description: The opm command arguments for building the catalog
    - name: idms_path
      type: string
      default: ".tekton/images-mirror-set.yaml"
      description: The path to the IDMS configuration for building the catalog
    - name: catalog-output-path
      type: string
      description: The path for the output catalog file
    - name: catalog-template-merge-script
      type: string
      description: The script to run prior to running the opm command to merge the catalog templates
    - name: catalog-patch-script
      type: string
      description: The script to run after running the opm command to generate the catalog
    - name: catalog-patch-image
      type: string
      description: The image to use when running the catalog patch script
    results:
    - description: ""
      name: IMAGE_URL
      value: $(tasks.build-image-index.results.IMAGE_URL)
    - description: ""
      name: IMAGE_DIGEST
      value: $(tasks.build-image-index.results.IMAGE_DIGEST)
    - description: ""
      name: CHAINS-GIT_URL
      value: $(tasks.clone-repository.results.url)
    - description: ""
      name: CHAINS-GIT_COMMIT
      value: $(tasks.clone-repository.results.commit)
    tasks:
    - name: init
      params:
      - name: enable-cache-proxy
        value: $(params.enable-cache-proxy)
      taskRef:
        params:
        - name: name
          value: init
        - name: bundle
          value: quay.io/konflux-ci/tekton-catalog/task-init:0.4.2@sha256:421003a5c077ecb820460e71637125ec9093d2101c749a32ede28e190283e9db
        - name: kind
          value: task
        resolver: bundles
    - name: clone-repository
      params:
      - name: url
        value: $(params.git-url)
      - name: revision
        value: $(params.revision)
      - name: ociStorage
        value: $(params.output-image).git
      - name: ociArtifactExpiresAfter
        value: $(params.image-expires-after)
      runAfter:
      - init
      taskRef:
        params:
        - name: name
          value: git-clone-oci-ta
        - name: bundle
          value: quay.io/konflux-ci/tekton-catalog/task-git-clone-oci-ta:0.2.6@sha256:a3678910c2bf9187a66a96066193cb41046fbb7097160bf2be6a374ed5e49d30
        - name: kind
          value: task
        resolver: bundles
      workspaces:
      - name: basic-auth
        workspace: git-auth
    - name: fbc-inject-lifecycle
      params:
      - name: SOURCE_ARTIFACT
        value: $(tasks.clone-repository.results.SOURCE_ARTIFACT)
      - name: ociStorage
        value: $(params.output-image).lifecycle
      - name: ociArtifactExpiresAfter
        value: $(params.image-expires-after)
      - name: CONTEXT
        value: $(params.path-context)
      - name: DOCKERFILE
        value: $(params.dockerfile)
      - name: BUILD_ARGS
        value:
        - $(params.build-args[*])
      runAfter:
      - clone-repository
      taskRef:
        params:
        - name: url
          value: https://github.com/redhat-chai-bot/konflux-ci_konflux-operator-tasks.git
        - name: revision
          value: task-security-context-hardening
        - name: pathInRepo
          value: task/fbc-inject-lifecycle-oci-ta/0.1/fbc-inject-lifecycle-oci-ta.yaml
        resolver: git
    - name: catalog-template-merge
      params:
      - name: ociStorage
        value: $(params.output-image).script
      - name: ociArtifactExpiresAfter
        value: $(params.image-expires-after)
      - name: SCRIPT_RUNNER_IMAGE
        value: $(params.catalog-patch-image)
      - name: SCRIPT
        value: $(params.catalog-template-merge-script)
      - name: HERMETIC
        value: $(params.hermetic)
      - name: SOURCE_ARTIFACT
        value: $(tasks.fbc-inject-lifecycle.results.SOURCE_ARTIFACT)
      runAfter:
      - fbc-inject-lifecycle
      taskRef:
        params:
        - name: name
          value: run-script-oci-ta
        - name: bundle
          value: quay.io/konflux-ci/tekton-catalog/task-run-script-oci-ta:0.1.3@sha256:ec40c7fd8efeb80c92e45c62b1acaff4a0c1882c3edd4bd14710e4115787e907
        - name: kind
          value: task
        resolver: bundles
    - name: run-opm-command
      params:
      - name: SOURCE_ARTIFACT
        value: $(tasks.catalog-template-merge.results.SCRIPT_ARTIFACT)
      - name: ociStorage
        value: $(params.output-image).opm
      - name: ociArtifactExpiresAfter
        value: $(params.image-expires-after)
      - name: OPM_ARGS
        value:
        - $(params.opm_args)
      - name: OPM_OUTPUT_PATH
        value: $(params.catalog-output-path)
      - name: IDMS_PATH
        value: $(params.idms_path)
      - name: FILE_TO_UPDATE_PULLSPEC
        value: $(params.catalog-output-path)
      runAfter:
      - catalog-template-merge
      taskRef:
        params:
        - name: url
          value: https://github.com/redhat-chai-bot/konflux-ci_konflux-operator-tasks.git
        - name: revision
          value: task-security-context-hardening
        - name: pathInRepo
          value: task/run-opm-command-oci-ta/0.1/run-opm-command-oci-ta.yaml
        resolver: git
    - name: prefetch-dependencies
      params:
      - name: input
        value: $(params.prefetch-input)
      - name: enable-package-registry-proxy
        value: $(params.enable-package-registry-proxy)
      - name: SOURCE_ARTIFACT
        value: $(tasks.run-opm-command.results.SOURCE_ARTIFACT)
      - name: ociStorage
        value: $(params.output-image).prefetch
      - name: ociArtifactExpiresAfter
        value: $(params.image-expires-after)
      runAfter:
      - run-opm-command
      taskRef:
        params:
        - name: name
          value: prefetch-dependencies-oci-ta
        - name: bundle
          value: quay.io/konflux-ci/tekton-catalog/task-prefetch-dependencies-oci-ta:0.10.1@sha256:c09c1c3ced67fb8740b2925a7de09c0810d4e8c8f148d41c21ffe37810d85c62
        - name: kind
          value: task
        resolver: bundles
      workspaces:
      - name: git-basic-auth
        workspace: git-auth
      - name: netrc
        workspace: netrc
    - name: run-catalog-patch-script
      params:
      - name: ociStorage
        value: $(params.output-image).script
      - name: ociArtifactExpiresAfter
        value: $(params.image-expires-after)
      - name: SCRIPT_RUNNER_IMAGE
        value: $(params.catalog-patch-image)
      - name: SCRIPT
        value: $(params.catalog-patch-script)
      - name: HERMETIC
        value: $(params.hermetic)
      - name: SOURCE_ARTIFACT
        value: $(tasks.prefetch-dependencies.results.SOURCE_ARTIFACT)
      runAfter:
      - prefetch-dependencies
      taskRef:
        params:
        - name: name
          value: run-script-oci-ta
        - name: bundle
          value: quay.io/konflux-ci/tekton-catalog/task-run-script-oci-ta:0.1.3@sha256:ec40c7fd8efeb80c92e45c62b1acaff4a0c1882c3edd4bd14710e4115787e907
        - name: kind
          value: task
        resolver: bundles
    - matrix:
        params:
        - name: PLATFORM
          value:
          - $(params.build-platforms)
      name: build-images
      params:
      - name: IMAGE
        value: $(params.output-image)
      - name: DOCKERFILE
        value: $(params.dockerfile)
      - name: CONTEXT
        value: $(params.path-context)
      - name: HERMETIC
        value: $(params.hermetic)
      - name: PREFETCH_INPUT
        value: $(params.prefetch-input)
      - name: IMAGE_EXPIRES_AFTER
        value: $(params.image-expires-after)
      - name: COMMIT_SHA
        value: $(tasks.clone-repository.results.commit)
      - name: BUILD_ARGS
        value:
        - $(params.build-args[*])
      - name: BUILD_ARGS_FILE
        value: $(params.build-args-file)
      - name: SOURCE_URL
        value: $(tasks.clone-repository.results.url)
      - name: SOURCE_ARTIFACT
        value: $(tasks.run-catalog-patch-script.results.SCRIPT_ARTIFACT)
      - name: CACHI2_ARTIFACT
        value: $(tasks.prefetch-dependencies.results.CACHI2_ARTIFACT)
      - name: IMAGE_APPEND_PLATFORM
        value: "true"
      - name: ADDITIONAL_BASE_IMAGES
        value:
        - $(tasks.catalog-template-merge.results.SCRIPT_RUNNER_IMAGE_REFERENCE)
        - $(tasks.run-catalog-patch-script.results.SCRIPT_RUNNER_IMAGE_REFERENCE)
      - name: SOURCE_DATE_EPOCH
        value: $(params.source-date-epoch)
      - name: REWRITE_TIMESTAMP
        value: $(params.rewrite-timestamp)
      - name: OMIT_HISTORY
        value: $(params.omit-history)
      runAfter:
      - run-catalog-patch-script
      taskRef:
        params:
        - name: name
          value: buildah-remote-oci-ta
        - name: bundle
          value: quay.io/konflux-ci/tekton-catalog/task-buildah-remote-oci-ta:0.12.3@sha256:88b971c800b3e71903ddad83da884d092e9beda8b51deaf980f6525e45ed043f
        - name: kind
          value: task
        resolver: bundles
    - name: build-image-index
      params:
      - name: IMAGE
        value: $(params.output-image)
      - name: ALWAYS_BUILD_INDEX
        value: $(params.build-image-index)
      - name: IMAGES
        value:
        - $(tasks.build-images.results.IMAGE_REF[*])
      runAfter:
      - build-images
      taskRef:
        params:
        - name: name
          value: build-image-index
        - name: bundle
          value: quay.io/konflux-ci/tekton-catalog/task-build-image-index:0.4@sha256:654446d8ec028b20ed6ada8a96486ff16692a25192755aa04a99cea8e0afb7e2
        - name: kind
          value: task
        resolver: bundles
    - name: deprecated-base-image-check
      params:
      - name: IMAGE_URL
        value: $(tasks.build-image-index.results.IMAGE_URL)
      - name: IMAGE_DIGEST
        value: $(tasks.build-image-index.results.IMAGE_DIGEST)
      runAfter:
      - build-image-index
      taskRef:
        params:
        - name: name
          value: deprecated-image-check
        - name: bundle
          value: quay.io/konflux-ci/tekton-catalog/task-deprecated-image-check:0.5@sha256:0ccc688a77e9b7b0b8973c132a1e840844137e77f887be4a0bec8893b0776872
        - name: kind
          value: task
        resolver: bundles
      when:
      - input: $(params.skip-checks)
        operator: in
        values:
        - "false"
    - name: apply-tags
      params:
      - name: IMAGE_URL
        value: $(tasks.build-image-index.results.IMAGE_URL)
      - name: IMAGE_DIGEST
        value: $(tasks.build-image-index.results.IMAGE_DIGEST)
      runAfter:
      - build-image-index
      taskRef:
        params:
        - name: name
          value: apply-tags
        - name: bundle
          value: quay.io/konflux-ci/tekton-catalog/task-apply-tags:0.3@sha256:3ab844157eccd68e95e4852adc06c3c4ea674edb7865a474b0a898227f2893d6
        - name: kind
          value: task
        resolver: bundles
    - name: validate-fbc
      params:
      - name: IMAGE_URL
        value: $(tasks.build-image-index.results.IMAGE_URL)
      - name: IMAGE_DIGEST
        value: $(tasks.build-image-index.results.IMAGE_DIGEST)
      runAfter:
      - build-image-index
      taskRef:
        params:
        - name: url
          value: https://github.com/redhat-chai-bot/konflux-ci_konflux-operator-tasks.git
        - name: revision
          value: task-security-context-hardening
        - name: pathInRepo
          value: task/validate-fbc/0.3/validate-fbc.yaml
        resolver: git
      when:
      - input: $(params.skip-checks)
        operator: in
        values:
        - "false"
    - name: fbc-target-index-pruning-check
      params:
      - name: IMAGE_URL
        value: $(tasks.build-image-index.results.IMAGE_URL)
      - name: IMAGE_DIGEST
        value: $(tasks.build-image-index.results.IMAGE_DIGEST)
      - name: TARGET_INDEX
        value: registry.redhat.io/redhat/redhat-operator-index
      - name: RENDERED_CATALOG_DIGEST
        value: $(tasks.validate-fbc.results.RENDERED_CATALOG_DIGEST)
      runAfter:
      - validate-fbc
      taskRef:
        params:
        - name: url
          value: https://github.com/redhat-chai-bot/konflux-ci_konflux-operator-tasks.git
        - name: revision
          value: task-security-context-hardening
        - name: pathInRepo
          value: task/fbc-target-index-pruning-check/0.1/fbc-target-index-pruning-check.yaml
        resolver: git
      when:
      - input: $(params.skip-checks)
        operator: in
        values:
        - "false"
    - name: fbc-fips-check-oci-ta
      params:
      - name: image-digest
        value: $(tasks.build-image-index.results.IMAGE_DIGEST)
      - name: image-url
        value: $(tasks.build-image-index.results.IMAGE_URL)
      - name: SOURCE_ARTIFACT
        value: $(tasks.prefetch-dependencies.results.SOURCE_ARTIFACT)
      runAfter:
      - build-image-index
      taskRef:
        params:
        - name: url
          value: https://github.com/redhat-chai-bot/konflux-ci_konflux-operator-tasks.git
        - name: revision
          value: task-security-context-hardening
        - name: pathInRepo
          value: task/fbc-fips-check-oci-ta/0.1/fbc-fips-check-oci-ta.yaml
        resolver: git
      when:
      - input: $(params.skip-checks)
        operator: in
        values:
        - "false"
    workspaces:
    - name: git-auth
      optional: true
    - name: netrc
      optional: true
  taskRunTemplate:
    serviceAccountName: build-pipeline-lvm-operator-c23e6
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
status: {}
